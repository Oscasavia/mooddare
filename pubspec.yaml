name: mooddare
description: Mood-based challenges, a photo beauty studio, and shared moments.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.4.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.2.1
  firebase_storage: ^12.2.0
  google_sign_in: ^6.2.1
  camera: ^0.11.0+1
  video_player: ^2.8.6
  image_picker: ^1.1.2
  image_cropper: ^9.1.0
  path_provider: ^2.1.3
  share_plus: ^10.0.2
  uuid: ^4.5.1
  gal: ^2.3.2
  image: ^4.5.4
  video_thumbnail: ^0.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  video_player_platform_interface: 6.4.0
  fake_cloud_firestore: ^3.1.0
  firebase_auth_mocks: ^0.14.1
  firebase_storage_mocks: ^0.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/google-g.png
