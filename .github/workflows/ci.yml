name: Check app
on: [push, pull_request]
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        working-directory: website
  moderation-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --prefix tooling/admin
      - run: npm run build --prefix tooling/admin
      - run: git diff --exit-code -- website/admin/app.js
      - run: node --test tooling/admin/browser.test.mjs
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test --coverage
      - run: python3 tooling/check_coverage.py --minimum 75
      - run: flutter test test/membership_preview_test.dart --dart-define=MOODDARE_MEMBERSHIP_PREVIEW=true
      - run: flutter build apk --debug --target-platform android-arm64
      - run: ./gradlew :app:testDebugUnitTest -Ptarget-platform=android-arm64
        working-directory: android
  firebase-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tooling/rules-tests/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 -m unittest discover -s tooling/dares -p "*_test.py"
      - run: node --test tooling/storage/check-access.test.cjs
      - run: node --test tooling/dares/publish.test.cjs
      - run: node --test tooling/weekly-dares/publish.test.cjs
      - run: npm ci --ignore-scripts --prefix functions
      - run: npm ci --ignore-scripts --prefix tooling/rules-tests
      - run: npx --yes firebase-tools@14.14.0 emulators:exec --project demo-mooddare --only firestore,storage 'npm --prefix tooling/rules-tests test && npm --prefix functions test'
