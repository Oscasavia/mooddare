<!doctype html><html lang="en"><meta charset="utf-8"><title>MoodDare — first look</title>
<style>html,body{margin:0;background:#0d0e14;color:#f4f2ed;font-family:Helvetica,Arial,sans-serif}canvas{display:block;max-width:100vw;max-height:100vh;margin:auto}button{position:fixed;bottom:24px;right:24px;border:0;border-radius:14px;background:#c5b4ff;color:#0d0e14;padding:14px 20px;font:600 15px Helvetica;cursor:pointer}</style>
<canvas id="film"></canvas><button id="play">Play animation</button><script src="film.js"></script>
<script>let zero;document.querySelector('#play').onclick=()=>{zero=performance.now();function tick(now){const t=(now-zero)/1000;renderFrame(Math.min(t,21.999));if(t<22)requestAnimationFrame(tick)}requestAnimationFrame(tick)};</script></html>
